---
layout: default
title: Projects
---

<section class="featured-work">
  <h2>All Work</h2>
  <div class="projects-grid">
    {% for project in site.projects %}
      <a href="{{ project.url }}" class="project-card">
        <div class="project-image" style="background-color: {{ project.color | default: '#f0f0f0' }}"></div>
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.excerpt }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
